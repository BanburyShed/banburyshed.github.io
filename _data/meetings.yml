# Meeting exceptions only — every Saturday at 09:30 is assumed by default.
#
# To cancel a meeting (shows "NO MEETING THIS WEEKEND!" by default):
#   - date: 2026-05-23
#     closed: true
#
# To cancel with a custom message:
#   - date: 2026-12-27
#     closed: true
#     message: WE ARE CLOSED FOR CHRISTMAS.
#
# To change the meeting time (earlier or later than 09:30):
#   - date: 2026-06-14
#     time: "10:00"
exceptions:
  - date: 2026-12-26
    closed: true
    message: WE ARE CLOSED FOR CHRISTMAS.
  - date: 2027-01-02
    closed: true
    message: WE ARE CLOSED FOR CHRISTMAS.
