<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <nav aria-label="Main navigation">
      <a href="/"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="/news/"{% if page.url == '/news/' %} aria-current="page"{% endif %}>News</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
