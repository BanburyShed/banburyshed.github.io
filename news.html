---
layout: default
title: News
permalink: /news/
---

<section aria-labelledby="news-heading">
  <h2 id="news-heading">Latest stories</h2>

  {% for post in site.posts %}
  <article>
    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <p><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %B %Y" }}</time></p>
    {{ post.excerpt }}
  </article>
  {% endfor %}
</section>
